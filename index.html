<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Creator</title>
<meta name="theme-color" content="#630C00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply the theme before the page draws, so it doesn't flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("workoutTheme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* Palette: maroon #630C00 · navy #002763 · olive #4A6300 · red #B81700
     Push = red, Pull = navy, Legs = olive, Core = maroon, Cardio = striped maroon */
  :root {
    --paper: #F4EEE4;
    --card: #FFFCF7;
    --ink: #23120C;
    --muted: #6F5F55;
    --line: #E3D7C8;
    --field: #FFFFFF;
    --brand: #630C00;
    --brand-ink: #FFF4E8;
    --red: #B81700;
    --navy: #002763;
    --olive: #4A6300;
    --on-color: #FFF8EF;          /* text on a solid palette colour */
    --g-push: #B81700; --g-pull: #002763; --g-legs: #4A6300; --g-core: #630C00; --g-cardio: #630C00; --g-custom: #8C7B70;
    --tint-olive: #EBF0D6;
    --tint-navy: #E3E9F4;
    --tint-red: #F8E2DC;
    --shadow: 0 1px 0 rgba(35, 18, 12, 0.05), 0 10px 24px -16px rgba(35, 18, 12, 0.35);
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --paper: #14100E;
    --card: #1E1815;
    --ink: #F2E8DC;
    --muted: #B3A497;
    --line: #362C26;
    --field: #171210;
    --brand: #B81700;
    --brand-ink: #FFF4E8;
    --red: #F0603F;
    --navy: #7C9FE0;
    --olive: #A9C140;
    --on-color: #14100E;
    --g-push: #F0603F; --g-pull: #7C9FE0; --g-legs: #A9C140; --g-core: #D98068; --g-cardio: #D98068; --g-custom: #9C8B80;
    --tint-olive: #252B12;
    --tint-navy: #131D31;
    --tint-red: #36150F;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 10px 24px -16px rgba(0, 0, 0, 0.8);
  }
  .g-push { --g: var(--g-push); } .g-pull { --g: var(--g-pull); } .g-legs { --g: var(--g-legs); }
  .g-core { --g: var(--g-core); } .g-cardio { --g: var(--g-cardio); } .g-custom { --g: var(--g-custom); }

  * { box-sizing: border-box; }
  html { color-scheme: light; scroll-padding-bottom: 70px; -webkit-text-size-adjust: 100%; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body {
    font-family: var(--body); font-size: 16px; line-height: 1.45; color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1.3px);
    background-size: 22px 22px;
    max-width: 760px; margin: 0 auto;
    padding: 18px max(16px, env(safe-area-inset-right)) 84px max(16px, env(safe-area-inset-left));
  }
  h1, h2, h3 { font-family: var(--display); }
  h2 { font-size: 1.3rem; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; }
  h3 { font-size: 0.9rem; margin: 16px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--g, var(--muted)); }
  strong { font-weight: 700; }

  button, select, input { font: inherit; font-size: 16px; min-height: 42px; padding: 8px 12px; border-radius: 10px; }
  input, select { background: var(--field); color: var(--ink); border: 1.5px solid var(--line); }
  input::placeholder { color: var(--muted); opacity: 0.7; }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
  button {
    background: var(--card); color: var(--ink); border: 1.5px solid var(--line); cursor: pointer; font-weight: 600;
    transition: transform 0.08s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  button:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, black); }
  button.primary:active { box-shadow: 0 0 0 transparent; transform: translateY(3px); }
  button.danger { color: var(--red); }
  button.ghost { background: transparent; }
  .muted { color: var(--muted); font-size: 0.9em; }
  .tag { font-size: 0.8rem; color: var(--brand); font-weight: 600; }
  :root[data-theme="dark"] .tag { color: var(--red); }
  .empty { padding: 10px 0; margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .bar > input { flex: 1 1 170px; min-width: 0; }
  .full { flex: 1 1 100%; }

  /* Masthead */
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 4px 0 10px; }
  .kicker { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.78rem; font-weight: 600; color: var(--muted); }
  h1 { margin: 2px 0 0; font-size: 2.7rem; line-height: 0.88; font-weight: 800; text-transform: uppercase; }
  h1 .w1 { color: var(--brand); display: block; }
  :root[data-theme="dark"] h1 .w1 { color: var(--red); }
  .stripe { display: flex; height: 6px; gap: 3px; margin: 0 0 8px; }
  .stripe i { flex: 1; border-radius: 2px; }
  .stripe i:nth-child(1) { background: #630C00; } .stripe i:nth-child(2) { background: #002763; }
  .stripe i:nth-child(3) { background: #4A6300; } .stripe i:nth-child(4) { background: #B81700; }
  #themeBtn { min-height: 38px; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .status { margin: 0; font-size: 0.82rem; }

  /* This week */
  .week { margin: 14px 0 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .week-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .week-top h2 { font-size: 1.4rem; }
  .dots { display: flex; gap: 5px; }
  .dots i {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center;
    font-style: normal; font-family: var(--display); font-weight: 700; font-size: 0.72rem; color: var(--muted);
  }
  .dots i.today { border-color: var(--ink); color: var(--ink); }
  .dots i.on { background: var(--olive); border-color: var(--olive); color: var(--on-color); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--paper); border-radius: 12px; padding: 8px 10px 6px; }
  .stat b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; font-weight: 800; }
  .stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .stat.s1 b { color: var(--olive); } .stat.s2 b { color: var(--navy); } .stat.s3 b { color: var(--red); }
  .week-last { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }

  /* Section headings: 01 TRAINING DAYS ———— */
  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 6px; }
  .section-head .num { font-family: var(--display); font-weight: 800; font-size: 1rem; color: var(--brand); }
  :root[data-theme="dark"] .section-head .num { color: var(--red); }
  .section-head h2 { flex: 1; font-size: 1.55rem; border-bottom: 2px solid var(--ink); line-height: 1.15; }
  .section { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; box-shadow: var(--shadow); }
  .fold button { min-height: 34px; padding: 4px 12px; font-size: 14px; border-radius: 999px; background: transparent; }

  /* Days */
  .day { padding: 10px 14px 14px; }
  .day-head { display: flex; align-items: center; gap: 2px; }
  .handle {
    border: none; background: none; color: var(--muted); font-size: 1.35em; line-height: 1;
    min-width: 32px; min-height: 40px; padding: 0; cursor: grab; touch-action: none; user-select: none; box-shadow: none;
  }
  .handle:hover { color: var(--brand); }
  .day-title {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; text-align: left;
    background: none; border: none; padding: 4px 0; color: var(--ink); box-shadow: none;
  }
  .day-title .day-name { flex: 1; overflow-wrap: anywhere; font-family: var(--display); font-size: 1.45rem; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
  .day-title .arrow { color: var(--brand); width: 1em; display: inline-block; transition: transform 0.15s; }
  :root[data-theme="dark"] .day-title .arrow { color: var(--red); }
  .day.collapsed .day-title .arrow { transform: rotate(-90deg); }
  .split { display: flex; gap: 2px; height: 6px; margin: 2px 0 6px 34px; border-radius: 99px; overflow: hidden; }
  .split i { display: block; background: var(--g); }
  .split i.g-cardio { background: repeating-linear-gradient(135deg, var(--g) 0 4px, transparent 4px 7px); }
  .day-summary { margin: 2px 0 0 34px; }
  .day-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .day-buttons button { flex: 1 1 auto; min-height: 34px; padding: 4px 10px; font-size: 14px; border-radius: 999px; background: transparent; }

  /* Exercises */
  .exercise { border-top: 1.5px dashed var(--line); padding: 6px 0; background: var(--card); }
  .exercise.new { animation: flash 1.1s ease-out; }
  @keyframes flash { from { background: var(--tint-olive); } to { background: var(--card); } }
  .ex-head { display: flex; align-items: flex-start; gap: 2px; }
  .ex-title {
    flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 6px 0; color: var(--ink); box-shadow: none;
    display: flex; flex-direction: column; gap: 1px; font-weight: 400;
  }
  .ex-title .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ex-title strong { font-size: 1.05rem; overflow-wrap: anywhere; }
  .cat { font-size: 0.8rem; font-weight: 600; color: var(--g, var(--muted)); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--g, var(--muted)); margin-right: 6px; vertical-align: 1px; flex: 0 0 auto; }
  .g-cardio .dot, .dot.g-cardio { background: repeating-linear-gradient(135deg, var(--g) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--g); }
  .pr {
    display: inline-block; font-family: var(--display); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.1em;
    color: var(--red); border: 2px solid var(--red); border-radius: 5px; padding: 0 5px; line-height: 1.35;
    transform: rotate(-5deg); vertical-align: 1px;
  }
  .ex-body { padding: 2px 0 8px 34px; }
  .hint { background: var(--tint-navy); border-left: 4px solid var(--navy); border-radius: 8px; padding: 8px 10px; margin: 4px 0 10px; font-size: 0.9em; }
  .set-row { display: flex; align-items: center; gap: 6px; margin: 7px 0; }
  .set-n {
    flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--paper); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 0.85rem;
  }
  .set-row input { flex: 1 1 0; min-width: 0; width: 0; }
  .set-row .x { color: var(--muted); font-size: 0.9em; }
  .set-row.done .set-n { background: var(--olive); color: var(--on-color); }
  .set-row.done input { background: var(--tint-olive); border-color: transparent; }
  .tick { flex: 0 0 46px; padding: 0; font-size: 1.1rem; color: var(--muted); }
  .tick.on { background: var(--olive); border-color: var(--olive); color: var(--on-color); }
  .mini { min-height: 32px; min-width: 32px; padding: 0 10px; font-size: 14px; border-radius: 999px; }
  .plan-fields { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1.5px dashed var(--line); }
  .plan-fields .w3 { grid-column: span 3; }
  .plan-fields .w2 { grid-column: span 2; }
  .plan-fields label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .plan-fields select, .plan-fields input { width: 100%; min-width: 0; padding: 6px 6px; margin-top: 2px; text-transform: none; letter-spacing: 0; }
  .plan-fields .notes { grid-column: 1 / -1; }
  .row-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .row-buttons button { min-height: 36px; padding: 4px 12px; font-size: 14px; border-radius: 999px; }
  .add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .add-ex { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .add-ex:hover { border-style: solid; }
  button.finish { background: var(--red); border-color: var(--red); color: var(--on-color); box-shadow: 0 3px 0 color-mix(in srgb, var(--red) 55%, black); }
  button.finish:active { box-shadow: 0 0 0 transparent; transform: translateY(3px); }

  /* Dragging */
  body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  body.is-dragging .day, body.is-dragging .exercise { transition: transform 0.15s; }
  .dragging { position: relative; z-index: 5; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.45); transition: none !important; }

  /* Log, bodyweight, backup */
  details { border-top: 1.5px dashed var(--line); padding: 4px 0; }
  details:first-child { border-top: none; }
  summary { cursor: pointer; padding: 8px 0; font-weight: 600; }
  summary::marker { color: var(--brand); }
  details ul { margin: 4px 0 10px; padding-left: 20px; }
  details li { margin: 2px 0; }
  .bw-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .bw-list li { display: flex; align-items: center; gap: 8px; border-top: 1.5px dashed var(--line); padding: 6px 0; }
  .bw-list li span:first-child { flex: 1; }
  .bw-list strong { font-family: var(--display); font-size: 1.15rem; }
  .banner { background: var(--tint-red); border: 1.5px solid var(--red); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; }
  .banner .bar { margin-bottom: 0; }
  .file-label {
    display: inline-flex; align-items: center; min-height: 42px; padding: 8px 12px; border-radius: 10px; font-weight: 600;
    background: var(--card); color: var(--ink); border: 1.5px solid var(--line); cursor: pointer;
  }
  .file-label input { display: none; }

  /* Exercise picker */
  body.sheet-open { overflow: hidden; }
  #sheet { position: fixed; inset: 0; z-index: 20; background: rgba(25, 8, 3, 0.5); display: flex; align-items: flex-end; justify-content: center; }
  #sheet[hidden] { display: none; }
  .sheet-panel {
    background: var(--card); width: 100%; max-width: 760px; max-height: 90vh; display: flex; flex-direction: column;
    border-radius: 22px 22px 0 0; animation: sheetUp 0.22s ease-out; padding-bottom: env(safe-area-inset-bottom);
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0.5; } }
  .sheet-top { padding: 8px 16px 8px; border-bottom: 1.5px solid var(--line); }
  .grabber { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
  .sheet-top .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sheet-top h2 { font-size: 1.5rem; overflow-wrap: anywhere; }
  .sheet-top input { width: 100%; margin-top: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
  .chips button { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 36px; padding: 4px 14px; border-radius: 999px; font-size: 15px; }
  .chips button.on { background: var(--g, var(--ink)); border-color: var(--g, var(--ink)); color: var(--paper); }
  .chips button.on .dot { background: var(--paper); }
  #libList { overflow-y: auto; padding: 0 16px 24px; overscroll-behavior: contain; }
  .lib-items { display: flex; flex-direction: column; }
  .lib-item {
    display: flex; align-items: center; gap: 10px; text-align: left; min-height: 50px; padding: 8px 2px;
    background: none; border: none; border-bottom: 1px solid var(--line); border-radius: 0; font-weight: 500; box-shadow: none;
  }
  .lib-item:hover { border-color: var(--line); background: color-mix(in srgb, var(--g, var(--ink)) 6%, transparent); }
  .lib-item .name { flex: 1; }
  .lib-item .state { font-size: 0.75rem; color: var(--muted); }
  .lib-item .add {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--g, var(--line)); color: var(--g, var(--ink)); font-weight: 700; transition: background 0.15s, transform 0.15s;
  }
  .lib-item.in .add { background: var(--g, var(--ink)); color: var(--paper); transform: scale(1.05); }

  /* Toast + rest timer */
  #toast {
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 30; max-width: 90%;
    background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 0.92rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  #timer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #002763; color: #FFF4E8;
    padding: 5px 10px calc(5px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px -14px rgba(0, 0, 0, 0.6);
    transition: background 0.3s;
  }
  #timer .inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 5px; }
  #timer button {
    min-height: 34px; padding: 2px 6px; font-size: 15px; flex: 1 1 0; min-width: 0; border-radius: 8px;
    background: transparent; color: #FFF4E8; border: 1.5px solid rgba(255, 244, 232, 0.3); box-shadow: none;
  }
  #timer button:hover { border-color: rgba(255, 244, 232, 0.7); }
  #timer button.primary { background: #B81700; border-color: #B81700; }
  #timer .icon-btn { flex: 0 0 38px; font-size: 19px; line-height: 1; }
  #timerDisplay { font-family: var(--display); font-size: 1.55rem; font-weight: 800; min-width: 52px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  #timer.done { background: #B81700; }
  #timer.done button.primary { background: #630C00; border-color: #630C00; }
  footer { margin-top: 34px; text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.8rem; }
  @media (max-width: 500px) {
    h1 { font-size: 2.2rem; }
    .ex-body { padding-left: 2px; }
    .stat b { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <span class="kicker">Plan it &middot; Lift it &middot; Log it</span>
    <h1><span class="w1">Workout</span> Creator</h1>
  </div>
  <button id="themeBtn" class="ghost" onclick="toggleTheme()">Dark</button>
</header>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<p class="muted status" id="status">Changes save automatically in this browser.</p>

<div class="banner" id="backupBanner" hidden>
  <span class="msg"></span>
  <div class="bar">
    <button class="primary" onclick="exportData()">Back up now</button>
    <button class="ghost" onclick="snoozeBackup()">Remind me later</button>
  </div>
</div>

<section class="week" id="week" aria-label="This week"></section>

<div class="section-head"><span class="num">01</span><h2>Training days</h2></div>
<div class="bar">
  <input id="newDayName" placeholder="Name a day, e.g. Monday &middot; Push">
  <button class="primary" onclick="addDay()">+ Add day</button>
</div>
<div class="bar fold" id="foldBar">
  <button onclick="setAllCollapsed(true)">Collapse all</button>
  <button onclick="setAllCollapsed(false)">Expand all</button>
</div>
<div id="days"></div>

<div class="section-head"><span class="num">02</span><h2>Workout log</h2></div>
<div class="section">
  <p class="muted" style="margin-top:0">Tap an exercise, enter your sets and tick &#10003; as you go. Hit "Finish workout" to save it here.</p>
  <div id="log"></div>
</div>

<div class="section-head"><span class="num">03</span><h2>Bodyweight</h2></div>
<div class="section">
  <div class="bar" style="margin-top:0">
    <input type="date" id="bwDate" aria-label="Date">
    <input id="bwWeight" inputmode="decimal" placeholder="Weight (lbs)" aria-label="Bodyweight">
    <button class="primary" onclick="addBodyweight()">Add</button>
  </div>
  <div id="bodyweight"></div>
</div>

<div class="section-head"><span class="num">04</span><h2>Save &amp; backup</h2></div>
<div class="section">
  <p class="muted" id="backupInfo" style="margin-top:0"></p>
  <div class="bar" style="margin-bottom:0">
    <button class="primary" onclick="saveNow()">Save</button>
    <button onclick="exportData()">Export to File</button>
    <label class="file-label">Import from File<input type="file" accept=".json" onchange="importData(event)"></label>
    <button class="danger" onclick="clearAll()">Clear All</button>
  </div>
</div>

<footer class="muted" id="version"></footer>

<!-- Exercise picker (add or swap) -->
<div id="sheet" hidden onclick="if (event.target === this) closeLibrary()">
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-top">
      <div class="grabber" aria-hidden="true"></div>
      <div class="title-row">
        <h2 id="sheetTitle">Add exercise</h2>
        <button class="primary" id="libDone" onclick="closeLibrary()">Done</button>
      </div>
      <input id="libSearch" type="search" placeholder="Search (optional)" autocomplete="off" oninput="lib.query = this.value; renderLibrary()">
      <div class="chips" id="libChips"></div>
    </div>
    <div id="libList"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Rest timer, pinned to the bottom of the screen -->
<div id="timer">
  <div class="inner">
    <span id="timerDisplay" title="Rest timer">0:00</span>
    <button onclick="startTimer(30)">30s</button>
    <button onclick="startTimer(60)">60s</button>
    <button onclick="startTimer(90)">90s</button>
    <button onclick="startTimer(120)">2m</button>
    <button id="pauseBtn" class="primary icon-btn" onclick="togglePause()" aria-label="Pause">&#9208;&#xFE0E;</button>
    <button class="icon-btn" onclick="resetTimer()" aria-label="Reset" title="Reset">&#8634;</button>
  </div>
</div>

<script>
const APP_VERSION = "2.1";
const KEYS = { plan: "workoutPlan", log: "workoutLog", body: "workoutBodyweight", settings: "workoutSettings" };
const BACKUP_EVERY_DAYS = 7;
const DAY_MS = 24 * 60 * 60 * 1000;

// ---------- Dark mode ----------
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  el("themeBtn").textContent = t === "dark" ? "\u2600\uFE0E Light" : "\u263E Dark";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#14100E" : "#630C00");
}
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try { localStorage.setItem("workoutTheme", t); } catch (e) {}
  setTheme(t);
}

// ---------- Exercise library, grouped by Push / Pull / Legs / Core / Cardio and body part ----------
const LIBRARY = {
  "Push - Chest": ["Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Press", "Incline Dumbbell Press", "Decline Dumbbell Press", "Machine Chest Press", "Smith Machine Bench Press", "Chest Fly", "Incline Dumbbell Fly", "Pec Deck", "Cable Crossover", "Low-to-High Cable Fly", "Push-Ups", "Incline Push-Ups", "Decline Push-Ups", "Dips (Chest)", "Landmine Press", "Svend Press"],
  "Push - Shoulders": ["Overhead Press", "Seated Barbell Press", "Dumbbell Shoulder Press", "Machine Shoulder Press", "Arnold Press", "Push Press", "Lateral Raise", "Cable Lateral Raise", "Machine Lateral Raise", "Front Raise", "Plate Front Raise", "Upright Row", "Pike Push-Ups", "Handstand Push-Ups"],
  "Push - Triceps": ["Tricep Pushdown", "Rope Pushdown", "Single-Arm Cable Pushdown", "Skull Crushers", "Dumbbell Skull Crushers", "Overhead Tricep Extension", "Cable Overhead Extension", "Close-Grip Bench Press", "JM Press", "Dips (Triceps)", "Bench Dips", "Diamond Push-Ups", "Kickbacks"],
  "Pull - Back": ["Deadlift", "Rack Pull", "Pull-Ups", "Chin-Ups", "Neutral-Grip Pull-Ups", "Assisted Pull-Ups", "Lat Pulldown", "Close-Grip Lat Pulldown", "Straight-Arm Pulldown", "Barbell Row", "Pendlay Row", "Dumbbell Row", "Chest-Supported Row", "Seated Cable Row", "T-Bar Row", "Machine Row", "Meadows Row", "Inverted Row", "Back Extension"],
  "Pull - Rear Delts / Traps": ["Face Pulls", "Reverse Fly", "Reverse Pec Deck", "Cable Rear Delt Fly", "Barbell Shrugs", "Dumbbell Shrugs", "Farmer's Carry"],
  "Pull - Biceps": ["Barbell Curl", "EZ-Bar Curl", "Dumbbell Curl", "Alternating Dumbbell Curl", "Hammer Curl", "Incline Dumbbell Curl", "Preacher Curl", "Spider Curl", "Cable Curl", "Bayesian Cable Curl", "Concentration Curl", "Reverse Curl"],
  "Pull - Forearms / Grip": ["Wrist Curl", "Reverse Wrist Curl", "Dead Hang", "Plate Pinch", "Wrist Roller"],
  "Legs - Quads": ["Squat", "Front Squat", "Goblet Squat", "Hack Squat", "Smith Machine Squat", "Leg Press", "Lunges", "Walking Lunges", "Reverse Lunges", "Bulgarian Split Squat", "Step-Ups", "Leg Extension", "Sissy Squat", "Wall Sit"],
  "Legs - Hamstrings / Glutes": ["Romanian Deadlift", "Stiff-Leg Deadlift", "Sumo Deadlift", "Single-Leg Romanian Deadlift", "Lying Leg Curl", "Seated Leg Curl", "Nordic Curl", "Hip Thrust", "Glute Bridge", "Cable Kickback", "Cable Pull-Through", "Good Mornings", "Kettlebell Swing"],
  "Legs - Adductors / Abductors": ["Hip Adduction Machine", "Hip Abduction Machine", "Copenhagen Plank", "Banded Lateral Walk"],
  "Legs - Calves": ["Standing Calf Raise", "Seated Calf Raise", "Leg Press Calf Raise", "Single-Leg Calf Raise", "Tibialis Raise"],
  "Core": ["Plank", "Side Plank", "Crunches", "Bicycle Crunch", "Hanging Leg Raise", "Hanging Knee Raise", "Lying Leg Raise", "Russian Twist", "Cable Crunch", "Ab Wheel", "Dead Bug", "Bird Dog", "Mountain Climbers", "Pallof Press", "Cable Woodchopper", "V-Ups", "Hollow Body Hold", "Sit-Ups"],
  "Cardio / Conditioning": ["Treadmill", "Incline Walk", "Stationary Bike", "Rowing Machine", "Stair Climber", "Elliptical", "Jump Rope", "Burpees", "Sled Push", "Battle Ropes", "Box Jumps"]
};
const GROUPS = ["Push", "Pull", "Legs", "Core", "Cardio"];
// How each exercise is tracked: weight × reps, reps only (bodyweight), or time (holds and cardio).
// Library exercises start with a sensible type; it can be changed per exercise under "Tracks".
const TRACK_TYPES = { weight: "Weight \u00d7 reps", reps: "Reps only", time: "Time" };
const TIME_EXERCISES = ["Plank", "Side Plank", "Hollow Body Hold", "Wall Sit", "Dead Hang", "Copenhagen Plank",
  "Treadmill", "Incline Walk", "Stationary Bike", "Rowing Machine", "Stair Climber", "Elliptical", "Jump Rope", "Battle Ropes"];
const REPS_EXERCISES = ["Push-Ups", "Incline Push-Ups", "Decline Push-Ups", "Dips (Chest)", "Pike Push-Ups", "Handstand Push-Ups",
  "Dips (Triceps)", "Bench Dips", "Diamond Push-Ups", "Pull-Ups", "Chin-Ups", "Neutral-Grip Pull-Ups", "Inverted Row",
  "Back Extension", "Sissy Squat", "Nordic Curl", "Glute Bridge", "Banded Lateral Walk", "Crunches", "Bicycle Crunch",
  "Hanging Leg Raise", "Hanging Knee Raise", "Lying Leg Raise", "Russian Twist", "Ab Wheel", "Dead Bug", "Bird Dog",
  "Mountain Climbers", "V-Ups", "Sit-Ups", "Burpees", "Box Jumps"];
const TIME_OPTIONS = [10, 15, 20, 30, 40, 45, 60, 75, 90, 120, 150, 180, 240, 300, 360, 420, 480, 600, 720, 900, 1200, 1500, 1800, 2400, 2700, 3600];
const EFFORT_OPTIONS = ["RIR 0", "RIR 1", "RIR 2", "RIR 3", "RIR 4", "RPE 6", "RPE 7", "RPE 7.5", "RPE 8", "RPE 8.5", "RPE 9", "RPE 9.5", "RPE 10"];

// ---------- Small helpers ----------
function el(id) { return document.getElementById(id); }
function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function todayStr() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function fmtDay(ymd) { // "2026-11-06" as a local date
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function categoryOf(name) {
  for (const cat in LIBRARY) if (LIBRARY[cat].includes(name)) return cat;
  return "Custom";
}
// "Push - Chest" -> "push" (used for the colour of each muscle group)
function groupOf(category) {
  const g = String(category || "").split(" ")[0];
  return GROUPS.includes(g) ? g.toLowerCase() : "custom";
}
function isCardio(name) { return categoryOf(name).startsWith("Cardio"); }
function defaultType(name) { return TIME_EXERCISES.includes(name) ? "time" : REPS_EXERCISES.includes(name) ? "reps" : "weight"; }
function defaultTime(name) { return isCardio(name) ? [1200, 1800] : [30, 60]; } // seconds

// Seconds from "90", "1:30" etc.
function parseTime(v) {
  const s = String(v ?? "").trim();
  const m = s.match(/^(\d+):(\d{1,2})$/);
  const n = m ? Number(m[1]) * 60 + Number(m[2]) : num(s);
  return n > 0 ? Math.round(n) : null;
}
// 45 -> "45s", 90 -> "1:30", 1200 -> "20 min"
function fmtDur(sec) {
  if (sec < 60) return sec + "s";
  if (sec >= 600 && sec % 60 === 0) return sec / 60 + " min";
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function targetText(ex) {
  const [a, b, f] = ex.type === "time" ? [ex.timeMin, ex.timeMax, fmtDur] : [ex.repMin, ex.repMax, String];
  return a === b ? f(a) : f(a) + "\u2013" + f(b);
}

let toastTimer = null;
function toast(msg) {
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
  setStatus(msg);
}
function setStatus(msg) { el("status").textContent = msg; }

// ---------- Loading, checking and saving data ----------
// Everything that is loaded or imported is cleaned first, so old or broken data can't break the page.
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}

function cleanSet(s) {
  const str = v => (v != null ? String(v) : "");
  return { weight: s ? str(s.weight) : "", reps: s ? str(s.reps) : "", time: s ? str(s.time) : "", done: !!(s && s.done) };
}

function cleanPlanExercise(e) {
  if (!e || typeof e !== "object" || !e.name) return null;
  const name = String(e.name);
  const libCat = categoryOf(name);
  const legacyReps = num(e.reps);                       // versions before 1.7 had one "reps" number
  let repMin = num(e.repMin) ?? legacyReps ?? 8;
  let repMax = num(e.repMax) ?? legacyReps ?? 12;
  if (repMin > repMax) [repMin, repMax] = [repMax, repMin];
  const [tMin, tMax] = defaultTime(name);
  let timeMin = num(e.timeMin) ?? tMin, timeMax = num(e.timeMax) ?? tMax;
  if (timeMin > timeMax) [timeMin, timeMax] = [timeMax, timeMin];
  return {
    id: e.id ? String(e.id) : uid(),
    name,
    // Library exercises always use the library's body part (older versions saved e.g. just "Legs")
    category: libCat !== "Custom" ? libCat : (e.category ? String(e.category) : "Custom"),
    type: TRACK_TYPES[e.type] ? e.type : defaultType(name),   // added in 2.0
    sets: Math.max(1, Math.min(20, Math.round(num(e.sets) ?? (isCardio(name) ? 1 : 3)))),
    repMin: Math.max(1, Math.round(repMin)),
    repMax: Math.max(1, Math.round(repMax)),
    timeMin: Math.max(1, Math.round(timeMin)),               // seconds
    timeMax: Math.max(1, Math.round(timeMax)),
    rir: e.rir != null ? String(e.rir) : "",
    weight: e.weight != null ? String(e.weight) : "",   // planned weight, used as a hint when there's no history
    notes: e.notes != null ? String(e.notes) : ""
  };
}

function cleanPlan(data) {
  if (!Array.isArray(data)) return [];
  const seen = new Set();
  return data.filter(d => d && typeof d === "object").map((d, i) => {
    const exercises = (Array.isArray(d.exercises) ? d.exercises : []).map(cleanPlanExercise).filter(Boolean);
    exercises.forEach(e => { while (seen.has(e.id)) e.id = uid(); seen.add(e.id); });
    let session = null;
    if (d.session && typeof d.session === "object" && d.session.sets && typeof d.session.sets === "object") {
      session = { started: String(d.session.started || new Date().toISOString()), sets: {} };
      exercises.forEach(e => {
        const list = d.session.sets[e.id];
        if (Array.isArray(list)) session.sets[e.id] = list.slice(0, 30).map(cleanSet);
      });
    }
    return { name: d.name ? String(d.name) : "Day " + (i + 1), collapsed: !!d.collapsed, exercises, session };
  });
}

function cleanLogExercise(e) {
  if (!e || typeof e !== "object" || !e.name) return null;
  const str = v => (v != null ? String(v) : "");
  let sets;
  if (Array.isArray(e.sets)) {
    sets = e.sets.filter(s => s && typeof s === "object").map(s => ({ weight: str(s.weight), reps: str(s.reps), time: str(s.time), pr: !!s.pr }));
  } else {
    // Logs from versions before 1.7 stored "3 sets of 10 at 135" — turn that into 3 set entries
    const n = Math.max(0, Math.min(20, Math.round(num(e.sets) ?? 0)));
    sets = Array.from({ length: n }, () => ({ weight: str(e.weight), reps: str(e.reps), time: "", pr: false }));
  }
  const type = TRACK_TYPES[e.type] ? e.type
    : sets.some(s => parseTime(s.time)) ? "time" : sets.some(s => num(s.weight) > 0) ? "weight" : "reps";
  return { name: String(e.name), type, sets, notes: e.notes ? String(e.notes) : "" };
}

function cleanLog(data) {
  if (!Array.isArray(data)) return [];
  return data
    .filter(l => l && typeof l === "object" && l.date && !isNaN(new Date(l.date)))
    .map(l => ({
      date: String(l.date),
      day: l.day ? String(l.day) : "Workout",
      exercises: (Array.isArray(l.exercises) ? l.exercises : []).map(cleanLogExercise).filter(Boolean)
    }))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function cleanBody(data) {
  if (!Array.isArray(data)) return [];
  return data
    .filter(b => b && /^\d{4}-\d{2}-\d{2}$/.test(b.date) && num(b.weight) > 0)
    .map(b => ({ date: b.date, weight: num(b.weight) }))
    .sort((a, b) => b.date.localeCompare(a.date));
}

function loadSettings() {
  const s = load(KEYS.settings) || {};
  return { lastBackup: s.lastBackup || null, snoozeUntil: s.snoozeUntil || null };
}

let plan = cleanPlan(load(KEYS.plan));
let log = cleanLog(load(KEYS.log));
let bodyweight = cleanBody(load(KEYS.body));
let settings = loadSettings();

function save() {
  try {
    localStorage.setItem(KEYS.plan, JSON.stringify(plan));
    localStorage.setItem(KEYS.log, JSON.stringify(log));
    localStorage.setItem(KEYS.body, JSON.stringify(bodyweight));
    localStorage.setItem(KEYS.settings, JSON.stringify(settings));
    setStatus("Saved " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("Could not save in this browser. Use Export to File.");
  }
}

// ---------- History, PRs and hints ----------
function e1rm(weight, reps) { return weight * (1 + reps / 30); } // estimated one-rep max (Epley)

// Most recent logged session for an exercise
// A set counts if it has reps or a time
function hasData(s) { return num(s.reps) > 0 || parseTime(s.time) > 0; }

// Only the parts of a set that matter for this kind of exercise
function forType(type, s) {
  return { weight: type === "weight" ? s.weight : "", reps: type === "time" ? "" : s.reps, time: type === "time" ? s.time : "", done: s.done };
}

function lastSession(name) {
  for (const entry of log) {
    const ex = entry.exercises.find(e => e.name === name && e.sets.some(hasData));
    if (ex) return { date: entry.date, sets: ex.sets.filter(hasData) };
  }
  return null;
}

// Best set ever logged for an exercise
function bestSoFar(name) {
  const best = { e1rm: 0, reps: 0, time: 0, any: false };
  for (const entry of log) for (const ex of entry.exercises) {
    if (ex.name !== name) continue;
    for (const s of ex.sets) addToBest(best, s);
  }
  return best;
}
function addToBest(best, s) {
  const t = parseTime(s.time), w = num(s.weight), r = num(s.reps);
  if (t) { best.any = true; best.time = Math.max(best.time, t); return; }
  if (!r) return;
  best.any = true;
  if (w > 0) best.e1rm = Math.max(best.e1rm, e1rm(w, r));
  else best.reps = Math.max(best.reps, r);
}

// Which of today's ticked sets beat everything before them (needs some history to compare with)
function sessionPRs(name, sets) {
  const best = bestSoFar(name);
  if (!best.any) return sets.map(() => false);
  return sets.map(s => {
    if (!s.done || !hasData(s)) return false;
    const t = parseTime(s.time), w = num(s.weight), r = num(s.reps);
    // Longest time, best estimated 1RM, or most reps without weight
    const pr = t ? t > best.time : w > 0 ? e1rm(w, r) > best.e1rm + 1e-9 : r > best.reps;
    addToBest(best, s);
    return pr;
  });
}

// "185 × 8, 8, 7" when the weight is the same, otherwise "185×8, 175×8"
function formatSets(sets) {
  const list = sets.filter(hasData);
  if (!list.length) return "";
  if (list.some(s => parseTime(s.time))) {
    return list.map(s => parseTime(s.time) ? fmtDur(parseTime(s.time)) : s.reps + " reps").join(", ");
  }
  const weights = list.map(s => String(s.weight || "").trim());
  if (weights.every(w => w === weights[0])) {
    return weights[0] ? weights[0] + " \u00d7 " + list.map(s => s.reps).join(", ") : list.map(s => s.reps).join(", ") + " reps";
  }
  return list.map(s => (s.weight ? s.weight + "\u00d7" : "") + s.reps).join(", ");
}

// Progressive overload: hit the top of the rep range on every target set last time? Add weight.
function overloadHint(ex, last) {
  if (!last) return "";
  if (ex.type === "time") {
    const times = last.sets.map(s => parseTime(s.time)).filter(Boolean);
    if (times.length < ex.sets || !times.slice(0, ex.sets).every(t => t >= ex.timeMax)) return "";
    return `You hit ${fmtDur(ex.timeMax)}+ on every set last time. Go a little longer or try a harder variation.`;
  }
  const sets = last.sets.filter(s => num(s.reps));
  if (sets.length < ex.sets || !sets.slice(0, ex.sets).every(s => num(s.reps) >= ex.repMax)) return "";
  return ex.type === "weight" && num(sets[0].weight) > 0
    ? `You hit ${ex.repMax}+ reps on every set last time. Add weight today (about +5 lbs).`
    : `You hit ${ex.repMax}+ reps on every set last time. Try a harder variation, or switch Tracks to "Weight \u00d7 reps" and add weight.`;
}

// What to pre-fill for a set: last session's numbers, or the plan
function suggestion(ex, n, last) {
  const s = last && (last.sets[n] || last.sets[last.sets.length - 1]);
  return {
    weight: s ? String(s.weight || "") : ex.weight,
    reps: s && num(s.reps) ? String(s.reps) : String(ex.repMax),
    time: String((s && parseTime(s.time)) || ex.timeMin)
  };
}

// ---------- Days ----------
function addDay() {
  const input = el("newDayName");
  const name = input.value.trim() || "Day " + (plan.length + 1);
  plan.push({ name, collapsed: false, exercises: [], session: null });
  input.value = "";
  save(); render();
}

function deleteDay(i) {
  if (!confirm("Delete " + plan[i].name + "?")) return;
  plan.splice(i, 1);
  save(); render();
}

function renameDay(i) {
  const name = prompt("New name for this day:", plan[i].name);
  if (name && name.trim()) { plan[i].name = name.trim(); save(); render(); }
}

function duplicateDay(i) {
  const copy = JSON.parse(JSON.stringify(plan[i]));
  copy.name += " (copy)";
  copy.collapsed = false;
  copy.session = null;
  copy.exercises.forEach(e => e.id = uid());
  plan.splice(i + 1, 0, copy);
  save(); render();
}

function toggleDay(i) {
  plan[i].collapsed = !plan[i].collapsed;
  save(); render();
}

function setAllCollapsed(value) {
  plan.forEach(d => d.collapsed = value);
  save(); render();
}

// ---------- Exercises (planning) ----------
const openExercises = new Set();   // which exercises are tapped open (not saved)
let flashId = null;

function findEx(i, id) { return plan[i].exercises.find(e => e.id === id); }

function newExercise(name) {
  return cleanPlanExercise({ name });
}

function toggleExercise(id) {
  openExercises.has(id) ? openExercises.delete(id) : openExercises.add(id);
  render();
}

function deleteExercise(i, id) {
  const ex = findEx(i, id);
  if (!confirm("Remove " + ex.name + " from " + plan[i].name + "?")) return;
  plan[i].exercises = plan[i].exercises.filter(e => e.id !== id);
  if (plan[i].session) delete plan[i].session.sets[id];
  save(); render();
}

function updatePlan(i, id, field, value) {
  const ex = findEx(i, id);
  if (field === "rir" || field === "type") ex[field] = value;
  else ex[field] = Number(value);
  if (field === "repMin" && ex.repMin > ex.repMax) ex.repMax = ex.repMin;
  if (field === "repMax" && ex.repMax < ex.repMin) ex.repMin = ex.repMax;
  if (field === "timeMin" && ex.timeMin > ex.timeMax) ex.timeMax = ex.timeMin;
  if (field === "timeMax" && ex.timeMax < ex.timeMin) ex.timeMin = ex.timeMax;
  // Fewer target sets: drop the empty rows at the end of today's sets (sets with data are kept)
  const list = field === "sets" && plan[i].session && plan[i].session.sets[id];
  if (list) {
    while (list.length > ex.sets) {
      const s = list[list.length - 1];
      if (s.done || String(s.weight).trim() || String(s.reps).trim() || String(s.time || "").trim()) break;
      list.pop();
    }
  }
  save(); render();
}

function updateNotes(i, id, value) {
  findEx(i, id).notes = value;
  save(); // no re-render so typing isn't interrupted
}

// ---------- Logging sets ----------
function rowsFor(day, ex) {
  const list = (day.session && day.session.sets[ex.id]) || [];
  const rows = [];
  for (let n = 0; n < Math.max(ex.sets, list.length); n++) rows.push(list[n] || { weight: "", reps: "", time: "", done: false });
  return rows;
}

function editableSets(i, id) {
  const day = plan[i], ex = findEx(i, id);
  if (!day.session) day.session = { started: new Date().toISOString(), sets: {} };
  const list = day.session.sets[id] || (day.session.sets[id] = []);
  while (list.length < ex.sets) list.push({ weight: "", reps: "", time: "", done: false });
  return list;
}

// Time sets have a minutes box and a seconds box; store the total in seconds
function updateTime(i, id, n, row) {
  const [m, sec] = row.querySelectorAll("input");
  const total = Math.round((num(m.value) || 0) * 60 + (num(sec.value) || 0));
  editableSets(i, id)[n].time = total > 0 ? String(total) : "";
  save(); // no re-render so typing isn't interrupted
}

function updateSet(i, id, n, field, value) {
  editableSets(i, id)[n][field] = value;
  save(); // no re-render so typing isn't interrupted
}

function toggleDone(i, id, n) {
  const ex = findEx(i, id);
  const set = editableSets(i, id)[n];
  if (set.done) {
    set.done = false;
  } else {
    // Ticking an empty set fills in last time's numbers
    const sug = suggestion(ex, n, lastSession(ex.name));
    if (ex.type === "time") {
      if (!parseTime(set.time)) set.time = sug.time;
    } else {
      if (ex.type === "weight" && !String(set.weight).trim() && sug.weight) set.weight = sug.weight;
      if (!String(set.reps).trim()) set.reps = sug.reps;
      if (!num(set.reps)) { toast("Enter the reps for this set first."); return; }
    }
    set.done = true;
  }
  save(); render();
  if (set.done) {
    const prs = sessionPRs(ex.name, editableSets(i, id).map(s => forType(ex.type, s)));
    toast(prs[n] ? "New PR on " + ex.name + "!" : "Set " + (n + 1) + " done.");
  }
}

function addSetRow(i, id) {
  const list = editableSets(i, id);
  const prev = list[list.length - 1];
  list.push({ weight: prev ? prev.weight : "", reps: "", time: "", done: false });
  save(); render();
}

function removeSetRow(i, id, n) {
  editableSets(i, id).splice(n, 1);
  save(); render();
}

function doneCount(day) {
  if (!day.session) return 0;
  return Object.values(day.session.sets).reduce((n, list) => n + list.filter(s => s.done).length, 0);
}

function finishWorkout(i) {
  const day = plan[i];
  const exercises = [];
  let prCount = 0;
  day.exercises.forEach(ex => {
    const list = ((day.session && day.session.sets[ex.id]) || []).map(s => forType(ex.type, s));
    const prs = sessionPRs(ex.name, list);
    const sets = [];
    list.forEach((s, n) => {
      if (s.done && hasData(s)) {
        sets.push({ weight: String(s.weight).trim(), reps: String(s.reps).trim(), time: String(s.time).trim(), pr: prs[n] });
        if (prs[n]) prCount++;
      }
    });
    if (sets.length) exercises.push({ name: ex.name, type: ex.type, sets, notes: ex.notes });
  });
  if (!exercises.length) { toast("Tick off at least one set (\u2713) before finishing."); return; }
  log.unshift({ date: new Date().toISOString(), day: day.name, exercises });
  day.session = null;
  day.exercises.forEach(ex => openExercises.delete(ex.id));
  save(); render(); renderLog(); renderBackupBanner();
  toast("Workout saved" + (prCount ? " \u2014 " + plural(prCount, "new PR") + "!" : "."));
}

function discardSession(i) {
  if (!confirm("Clear the sets you've entered for " + plan[i].name + "? Nothing will be saved to the log.")) return;
  plan[i].session = null;
  save(); render();
}

function deleteLogEntry(n) {
  if (!confirm("Delete this log entry?")) return;
  log.splice(n, 1);
  save(); render(); renderLog(); // render too, so "Last" and PRs update
}

// ---------- Exercise library (add / swap) ----------
let lib = { mode: "add", day: 0, exId: null, group: "All", query: "" };

function openLibrary(mode, i, exId) {
  const ex = exId ? findEx(i, exId) : null;
  const group = ex ? (LIBRARY[ex.category] ? "Similar" : "All") : (recentNames().length ? "Recent" : "All");
  lib = { mode, day: i, exId: exId || null, group, query: "", added: {} };
  el("libSearch").value = "";
  el("sheet").hidden = false;
  document.body.classList.add("sheet-open");
  renderLibrary();
  el("libList").scrollTop = 0;
}

// Exercises you've logged lately, newest first
function recentNames() {
  const out = [];
  for (const entry of log) for (const e of entry.exercises) {
    if (out.length >= 15) return out;
    if (!out.includes(e.name) && categoryOf(e.name) !== "Custom") out.push(e.name);
  }
  return out;
}

function closeLibrary() {
  el("sheet").hidden = true;
  document.body.classList.remove("sheet-open");
}

function setLibGroup(g) { lib.group = g; renderLibrary(); el("libList").scrollTop = 0; }

function renderLibrary() {
  const day = plan[lib.day];
  const current = lib.mode === "swap" ? findEx(lib.day, lib.exId) : null;
  el("sheetTitle").textContent = current ? "Swap " + current.name : "Add to " + day.name;
  const addedCount = Object.keys(lib.added || {}).length;
  el("libDone").textContent = addedCount ? `Done (${addedCount} added)` : "Done";

  const recent = current ? [] : recentNames();
  const groups = (current && LIBRARY[current.category] ? ["Similar"] : []).concat(recent.length ? ["Recent"] : [], ["All"], GROUPS);
  el("libChips").innerHTML = groups.map(g => {
    const gc = GROUPS.includes(g) ? " g-" + g.toLowerCase() : "";
    return `<button class="${g === lib.group ? "on" : ""}${gc}" onclick="setLibGroup('${g}')">${gc ? '<i class="dot"></i>' : ""}${g === "Similar" ? "Alternatives" : g}</button>`;
  }).join("");

  const q = lib.query.trim().toLowerCase();
  const inDay = new Set(day.exercises.map(e => e.name));
  const item = n => {
    const has = inDay.has(n), justAdded = lib.added && lib.added[n];
    const state = justAdded ? "in day &middot; tap to undo" : has ? "in day" : "";
    return `<button class="lib-item g-${groupOf(categoryOf(n))}${has ? " in" : ""}" data-name="${esc(n)}">` +
      `<i class="dot"></i><span class="name">${esc(n)}</span>${state ? `<span class="state">${state}</span>` : ""}` +
      `<span class="add" aria-hidden="true">${has ? "&#10003;" : "+"}</span></button>`;
  };

  let html = "";
  if (!q && lib.group === "Recent") {
    html = `<h3>Recently trained</h3><div class="lib-items">${recent.map(item).join("")}</div>`;
  } else {
    for (const cat in LIBRARY) {
      if (!q) {
        if (lib.group === "Similar" && cat !== current.category) continue;
        if (GROUPS.includes(lib.group) && !cat.startsWith(lib.group)) continue;
      }
      const names = LIBRARY[cat].filter(n =>
        (!q || n.toLowerCase().includes(q) || cat.toLowerCase().includes(q)) && !(current && n === current.name));
      if (!names.length) continue;
      html += `<h3 class="g-${groupOf(cat)}">${esc(cat)}</h3><div class="lib-items">${names.map(item).join("")}</div>`;
    }
  }
  el("libList").innerHTML = html || '<p class="muted empty">No exercises match. Try another group or search.</p>';
}

function pickFromLibrary(name) {
  const i = lib.day, day = plan[i];
  if (lib.mode === "swap") {
    const ex = findEx(i, lib.exId);
    const old = ex.name;
    ex.name = name;
    ex.category = categoryOf(name);
    const oldType = ex.type;
    ex.type = defaultType(name);
    if (ex.type === "time" && oldType !== "time") [ex.timeMin, ex.timeMax] = defaultTime(name);
    if (day.session) delete day.session.sets[ex.id];
    flashId = ex.id;
    closeLibrary();
    save(); render();
    toast("Swapped " + old + " for " + name + ".");
  } else {
    // Tapping something you just added takes it back out
    if (lib.added[name]) {
      const id = lib.added[name];
      day.exercises = day.exercises.filter(e => e.id !== id);
      if (day.session) delete day.session.sets[id];
      delete lib.added[name];
      save(); render(); renderLibrary();
      toast("Removed " + name + ".");
      return;
    }
    if (day.exercises.some(e => e.name === name)) { toast(name + " is already in " + day.name + "."); return; }
    const ex = newExercise(name);
    day.exercises.push(ex);
    day.collapsed = false;
    flashId = ex.id;
    lib.added[name] = ex.id;
    save(); render(); renderLibrary();
    toast("Added " + name + ".");
  }
}

// ---------- Drag to reorder (days and exercises; works with touch and mouse) ----------
let drag = null;

function dragStart(e, kind, i, k) {
  if (e.button > 0) return;
  e.preventDefault();
  const container = kind === "day" ? el("days") : document.querySelector(`.day[data-day="${i}"] .ex-list`);
  const items = [...container.children];
  if (items.length < 2) return;
  const from = kind === "day" ? i : k;
  const rects = items.map(it => it.getBoundingClientRect());
  drag = {
    kind, i, from, to: from, items, el: items[from], pointerY: e.clientY,
    tops: rects.map(r => r.top + scrollY), heights: rects.map(r => r.height),
    startY: e.clientY + scrollY, raf: 0
  };
  drag.space = Math.max(0, drag.tops[1] - drag.tops[0] - drag.heights[0]);
  drag.el.classList.add("dragging");
  document.body.classList.add("is-dragging");
  addEventListener("pointermove", dragMove, { passive: false });
  addEventListener("pointerup", dragEnd);
  addEventListener("pointercancel", dragEnd);
  drag.raf = requestAnimationFrame(autoScroll);
}

function dragMove(e) {
  if (!drag) return;
  e.preventDefault();
  drag.pointerY = e.clientY;
  layoutDrag();
}

function layoutDrag() {
  const d = drag;
  const dy = d.pointerY + scrollY - d.startY;
  d.el.style.transform = `translateY(${dy}px)`;
  const center = d.tops[d.from] + d.heights[d.from] / 2 + dy;
  d.to = d.items.filter((it, j) => j !== d.from && d.tops[j] + d.heights[j] / 2 < center).length;
  const gap = d.heights[d.from] + d.space;
  d.items.forEach((it, j) => {
    if (j === d.from) return;
    const shift = (d.from < j && j <= d.to) ? -gap : (d.to <= j && j < d.from) ? gap : 0;
    it.style.transform = shift ? `translateY(${shift}px)` : "";
  });
}

function autoScroll() {
  if (!drag) return;
  // Scroll when the finger is near the top, or just above the timer bar at the bottom
  const y = drag.pointerY, top = 60, bottom = el("timer").getBoundingClientRect().top - 30;
  const speed = y < top ? -Math.min(20, Math.ceil((top - y) / 6)) : y > bottom ? Math.min(20, Math.ceil((y - bottom) / 6)) : 0;
  if (speed) { scrollBy(0, speed); layoutDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}

function dragEnd() {
  if (!drag) return;
  const d = drag;
  drag = null;
  cancelAnimationFrame(d.raf);
  removeEventListener("pointermove", dragMove);
  removeEventListener("pointerup", dragEnd);
  removeEventListener("pointercancel", dragEnd);
  document.body.classList.remove("is-dragging");
  if (d.to !== d.from) {
    const list = d.kind === "day" ? plan : plan[d.i].exercises;
    const [moved] = list.splice(d.from, 1);
    list.splice(d.to, 0, moved);
    save();
  }
  render();
}

// ---------- Bodyweight ----------
function addBodyweight() {
  const date = el("bwDate").value || todayStr();
  const w = num(el("bwWeight").value);
  if (!(w > 0)) { toast("Enter your bodyweight first."); el("bwWeight").focus(); return; }
  const existing = bodyweight.find(b => b.date === date);
  if (existing) existing.weight = w;
  else bodyweight.push({ date, weight: w });
  bodyweight.sort((a, b) => b.date.localeCompare(a.date));
  el("bwWeight").value = "";
  save(); renderBody(); renderBackupBanner();
  toast("Bodyweight saved for " + fmtDay(date) + ".");
}

function deleteBodyweight(n) {
  if (!confirm("Delete this bodyweight entry?")) return;
  bodyweight.splice(n, 1);
  save(); renderBody();
}

function renderBody() {
  const box = el("bodyweight");
  if (!bodyweight.length) { box.innerHTML = '<p class="muted empty">No entries yet.</p>'; return; }
  const fmt = n => (Math.round(n * 10) / 10).toString();
  const change = (a, b) => { const c = a - b; return (c > 0 ? "+" : c < 0 ? "−" : "±") + fmt(Math.abs(c)); };
  const oldest = bodyweight[bodyweight.length - 1], latest = bodyweight[0];
  const row = (b, n) => `<li><span>${esc(fmtDay(b.date))}</span><strong>${fmt(b.weight)} lbs</strong>
      <span class="muted">${bodyweight[n + 1] ? change(b.weight, bodyweight[n + 1].weight) : ""}</span>
      <button class="mini danger" onclick="deleteBodyweight(${n})" aria-label="Delete entry">&times;</button></li>`;
  const recent = bodyweight.slice(0, 7).map((b, n) => row(b, n)).join("");
  const older = bodyweight.slice(7).map((b, n) => row(b, n + 7)).join("");
  box.innerHTML =
    (bodyweight.length > 1 ? `<p class="muted">Change since ${esc(fmtDay(oldest.date))}: <strong>${change(latest.weight, oldest.weight)} lbs</strong></p>` : "") +
    `<ul class="bw-list">${recent}</ul>` +
    (older ? `<details><summary>Older entries (${bodyweight.length - 7})</summary><ul class="bw-list">${older}</ul></details>` : "");
}

// ---------- Backup reminder ----------
function renderBackupBanner() {
  const now = Date.now();
  const last = settings.lastBackup ? Date.parse(settings.lastBackup) : null;
  el("backupInfo").textContent = last ? "Last backup: " + fmtDate(settings.lastBackup) + "." : "Not backed up yet.";
  const hasData = log.length > 0 || bodyweight.length > 0;
  const snoozed = settings.snoozeUntil && now < Date.parse(settings.snoozeUntil);
  const due = !last || now - last > BACKUP_EVERY_DAYS * DAY_MS;
  const banner = el("backupBanner");
  if (!hasData || snoozed || !due) { banner.hidden = true; return; }
  banner.querySelector(".msg").textContent = last
    ? `It's been ${Math.floor((now - last) / DAY_MS)} days since your last backup. Export a copy so you don't lose your workouts.`
    : "You haven't backed up yet. Your workouts are only saved in this browser, so export a copy to keep them safe.";
  banner.hidden = false;
}

function snoozeBackup() {
  settings.snoozeUntil = new Date(Date.now() + 3 * DAY_MS).toISOString();
  save(); renderBackupBanner();
}

// ---------- Rest timer ----------
// Counts down to a fixed end time, so it stays right even if the phone locks or you switch apps
let endTime = 0, timerLeft = 0, pausedMs = 0, timerId = null, paused = false, audioCtx = null;

function startTimer(seconds) {
  unlockAudio();
  clearInterval(timerId);
  paused = false;
  timerLeft = seconds;
  endTime = Date.now() + seconds * 1000;
  el("timer").classList.remove("done");
  setPauseButton(false);
  timerId = setInterval(tick, 250);
  showTime();
}

function tick() {
  if (paused) return;
  timerLeft = Math.ceil((endTime - Date.now()) / 1000);
  showTime();
  if (timerLeft <= 0) {
    clearInterval(timerId); timerId = null;
    el("timer").classList.add("done");
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }
}

function togglePause() {
  if (!timerId) return;
  paused = !paused;
  if (paused) pausedMs = endTime - Date.now();      // remember exactly how much was left
  else endTime = Date.now() + pausedMs;             // pick up where it left off
  setPauseButton(paused);
}

function resetTimer() {
  clearInterval(timerId); timerId = null; timerLeft = 0; paused = false;
  el("timer").classList.remove("done");
  setPauseButton(false);
  showTime();
}

function setPauseButton(isPaused) {
  const b = el("pauseBtn");
  b.textContent = isPaused ? "\u25B6\uFE0E" : "\u23F8\uFE0E";   // play / pause symbols (text style, not emoji)
  b.setAttribute("aria-label", isPaused ? "Resume" : "Pause");
  b.title = isPaused ? "Resume" : "Pause";
}

function showTime() {
  const t = Math.max(timerLeft, 0);
  el("timerDisplay").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

// Phones only allow sound that was started by a tap, so set audio up when a timer button is pressed
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}

function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.4].forEach(start => {
      const osc = audioCtx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + 0.25);
    });
  } catch (e) {}
}

// ---------- Save / load files ----------
function saveNow() { save(); }

function exportData() {
  const data = { version: APP_VERSION, plan, log, bodyweight };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "workout-plan-" + todayStr() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000); // releasing it straight away can cancel the download in some browsers
  settings.lastBackup = new Date().toISOString();
  settings.snoozeUntil = null;
  save(); renderBackupBanner();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) {          // files exported from Version 1.0 (plan only)
        plan = cleanPlan(data);
      } else if (data && Array.isArray(data.plan)) {
        plan = cleanPlan(data.plan);
        log = cleanLog(data.log);
        if (Array.isArray(data.bodyweight)) bodyweight = cleanBody(data.bodyweight);
      } else {
        throw new Error();
      }
      save(); renderAll();
      toast("Imported " + plural(plan.length, "day") + ", " + plural(log.length, "log entry").replace("entrys", "entries") + ".");
    } catch (e) {
      alert("That file is not a valid workout plan.");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

function clearAll() {
  if (!confirm("Delete all days, workouts, the workout log and bodyweight entries?")) return;
  plan = []; log = []; bodyweight = [];
  save(); renderAll();
}

// ---------- Render ----------
function options(values, current) {
  const list = values.map(String);
  if (current !== "" && current != null && !list.includes(String(current))) list.push(String(current));
  return list.map(v => `<option${v === String(current) ? " selected" : ""}>${esc(v)}</option>`).join("");
}
function range1to(b) { const out = []; for (let n = 1; n <= b; n++) out.push(n); return out; }

function render() {
  const box = el("days");
  el("foldBar").style.display = plan.length > 1 ? "" : "none";
  if (!plan.length) {
    box.innerHTML = '<div class="section"><p class="muted empty">No days yet. Add one above to get started.</p></div>';
    return;
  }
  box.innerHTML = plan.map(renderDay).join("");
  flashId = null;
}

// Thin bar under each day's name showing its push / pull / legs / core mix
function splitBar(day) {
  if (!day.exercises.length) return "";
  const counts = {};
  day.exercises.forEach(e => { const g = groupOf(e.category); counts[g] = (counts[g] || 0) + 1; });
  const order = ["push", "pull", "legs", "core", "cardio", "custom"].filter(g => counts[g]);
  const title = order.map(g => counts[g] + " " + g).join(" \u00b7 ");
  return `<div class="split" title="${title}" aria-hidden="true">${order.map(g => `<i class="g-${g}" style="flex:${counts[g]}"></i>`).join("")}</div>`;
}

function renderDay(day, i) {
  const done = doneCount(day);
  const progress = done ? ` <span class="tag">&middot; ${plural(done, "set")} done</span>` : "";
  const head = `
      <div class="day-head">
        <button class="handle" onpointerdown="dragStart(event,'day',${i})" aria-label="Drag to reorder ${esc(day.name)}" title="Drag to reorder">&#8801;</button>
        <button class="day-title" onclick="toggleDay(${i})" aria-expanded="${!day.collapsed}">
          <span class="arrow">&#9662;</span><span class="day-name">${esc(day.name)}</span><span class="muted">${plural(day.exercises.length, "exercise")}</span>
        </button>
      </div>${splitBar(day)}`;

  if (day.collapsed) {
    const summary = day.exercises.map(e => esc(e.name)).join(", ");
    return `
    <div class="section day collapsed" data-day="${i}">${head}
      ${summary || progress ? `<p class="muted day-summary">${summary}${progress}</p>` : ""}
    </div>`;
  }

  return `
    <div class="section day" data-day="${i}">${head}
      <div class="day-buttons">
        <button onclick="renameDay(${i})">Rename</button>
        <button onclick="duplicateDay(${i})">Copy</button>
        <button class="danger" onclick="deleteDay(${i})">Delete day</button>
      </div>
      <div class="ex-list">${day.exercises.map((ex, k) => renderExercise(day, i, ex, k)).join("")}</div>
      ${day.exercises.length ? "" : '<p class="muted empty">No exercises yet. Tap "+ Add exercise".</p>'}
      <div class="add-row">
        <button class="add-ex full" onclick="openLibrary('add', ${i})">+ Add exercise</button>
        ${day.exercises.length ? `<button class="finish full" onclick="finishWorkout(${i})">Finish workout &amp; save to log${progress ? " (" + plural(done, "set") + ")" : ""}</button>` : ""}
        ${day.session ? `<button class="danger full" onclick="discardSession(${i})">Clear today's sets</button>` : ""}
      </div>
    </div>`;
}

function timeOptions(current) {
  const list = TIME_OPTIONS.includes(current) ? TIME_OPTIONS : TIME_OPTIONS.concat(current).sort((a, b) => a - b);
  return list.map(v => `<option value="${v}"${v === current ? " selected" : ""}>${fmtDur(v)}</option>`).join("");
}

function renderExercise(day, i, ex, k) {
  const id = ex.id;
  const rows = rowsFor(day, ex);
  const prs = sessionPRs(ex.name, rows.map(s => forType(ex.type, s)));
  const done = rows.filter(s => s.done).length;
  const last = lastSession(ex.name);
  const hint = overloadHint(ex, last);
  const isOpen = openExercises.has(id);
  const target = `${ex.sets} \u00d7 ${targetText(ex)}${ex.rir ? " \u00b7 " + esc(ex.rir) : ""}`;
  const hintTag = { weight: "add weight", reps: "make it harder", time: "go longer" }[ex.type];

  const header = `
      <div class="ex-head">
        <button class="handle" onpointerdown="dragStart(event,'ex',${i},${k})" aria-label="Drag to reorder ${esc(ex.name)}" title="Drag to reorder">&#8801;</button>
        <button class="ex-title" onclick="toggleExercise('${id}')" aria-expanded="${isOpen}">
          <span class="line1"><strong>${esc(ex.name)}</strong><span class="muted">${done ? done + "/" + rows.length + " sets" : target}</span></span>
          <span class="cat g-${groupOf(ex.category)}"><i class="dot"></i>${esc(ex.category)}${prs.some(Boolean) ? ' &nbsp;<span class="pr">PR</span>' : ""}</span>
          <span class="muted">${last ? "Last: " + esc(formatSets(last.sets)) : "No history yet"}${hint ? ` &middot; <span class="tag">&#8593; ${hintTag}</span>` : ""}</span>
        </button>
      </div>`;
  if (!isOpen) return `<div class="exercise${flashId === id ? " new" : ""}">${header}</div>`;

  const setRows = rows.map((s, n) => {
    const sug = suggestion(ex, n, last);
    let inputs;
    if (ex.type === "time") {
      const t = parseTime(s.time), st = parseTime(sug.time);
      inputs = `
          <input inputmode="numeric" aria-label="Set ${n + 1} minutes" placeholder="${st ? Math.floor(st / 60) : 0}" value="${t ? (Math.floor(t / 60) || "") : ""}"
                 oninput="updateTime(${i},'${id}',${n},this.parentElement)">
          <span class="x">m</span>
          <input inputmode="numeric" aria-label="Set ${n + 1} seconds" placeholder="${st ? String(st % 60).padStart(2, "0") : "sec"}" value="${t ? String(t % 60).padStart(2, "0") : ""}"
                 oninput="updateTime(${i},'${id}',${n},this.parentElement)">
          <span class="x">s</span>`;
    } else if (ex.type === "reps") {
      inputs = `
          <input inputmode="numeric" aria-label="Set ${n + 1} reps" placeholder="${esc(sug.reps || "reps")}" value="${esc(s.reps)}"
                 oninput="updateSet(${i},'${id}',${n},'reps',this.value)">
          <span class="x">reps</span>`;
    } else {
      inputs = `
          <input inputmode="decimal" aria-label="Set ${n + 1} weight" placeholder="${esc(sug.weight || "lbs")}" value="${esc(s.weight)}"
                 oninput="updateSet(${i},'${id}',${n},'weight',this.value)">
          <span class="x">&times;</span>
          <input inputmode="numeric" aria-label="Set ${n + 1} reps" placeholder="${esc(sug.reps || "reps")}" value="${esc(s.reps)}"
                 oninput="updateSet(${i},'${id}',${n},'reps',this.value)">`;
    }
    return `
        <div class="set-row${s.done ? " done" : ""}">
          <span class="set-n">${n + 1}</span>${inputs}
          <button class="tick${s.done ? " on" : ""}" onclick="toggleDone(${i},'${id}',${n})" aria-pressed="${s.done}" aria-label="Set ${n + 1} done">&#10003;</button>
          ${prs[n] ? '<span class="pr">PR</span>' : ""}
          ${n >= ex.sets ? `<button class="mini danger" onclick="removeSetRow(${i},'${id}',${n})" aria-label="Remove set ${n + 1}">&times;</button>` : ""}
        </div>`;
  }).join("");

  const howTo = { weight: "Weight &times; reps", reps: "Reps (no weight needed)", time: "Time (minutes and seconds)" }[ex.type];
  const range = ex.type === "time" ? `
          <label class="w2">Time from<select onchange="updatePlan(${i},'${id}','timeMin',this.value)">${timeOptions(ex.timeMin)}</select></label>
          <label class="w2">Time to<select onchange="updatePlan(${i},'${id}','timeMax',this.value)">${timeOptions(ex.timeMax)}</select></label>` : `
          <label class="w2">Reps from<select onchange="updatePlan(${i},'${id}','repMin',this.value)">${options(range1to(50), ex.repMin)}</select></label>
          <label class="w2">Reps to<select onchange="updatePlan(${i},'${id}','repMax',this.value)">${options(range1to(50), ex.repMax)}</select></label>`;

  return `
    <div class="exercise open${flashId === id ? " new" : ""}">${header}
      <div class="ex-body">
        ${hint ? `<p class="hint">${esc(hint)}</p>` : ""}
        <div class="muted">${howTo} &mdash; tick &#10003; when a set is done. An empty set fills in last time's numbers.</div>
        ${setRows}
        <button class="mini" onclick="addSetRow(${i},'${id}')">+ Set</button>
        <div class="plan-fields">
          <label class="w3">Tracks<select onchange="updatePlan(${i},'${id}','type',this.value)">${
            Object.entries(TRACK_TYPES).map(([v, l]) => `<option value="${v}"${v === ex.type ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
          <label class="w3">Effort<select onchange="updatePlan(${i},'${id}','rir',this.value)"><option value="">&mdash;</option>${options(EFFORT_OPTIONS, ex.rir)}</select></label>
          <label class="w2">Target sets<select onchange="updatePlan(${i},'${id}','sets',this.value)">${options(range1to(10), ex.sets)}</select></label>${range}
          <label class="notes">Notes<input value="${esc(ex.notes)}" oninput="updateNotes(${i},'${id}',this.value)"></label>
        </div>
        <div class="row-buttons">
          <button onclick="openLibrary('swap', ${i}, '${id}')">Swap exercise</button>
          <button class="danger" onclick="deleteExercise(${i},'${id}')">Remove</button>
        </div>
      </div>
    </div>`;
}

function renderWeek() {
  const now = new Date();
  const dayStart = d => { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); };
  const today = dayStart(now);
  const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7));
  const week = log.filter(e => new Date(e.date) >= monday);
  const sets = week.reduce((n, e) => n + e.exercises.reduce((m, x) => m + x.sets.length, 0), 0);
  const prs = week.reduce((n, e) => n + e.exercises.reduce((m, x) => m + x.sets.filter(s => s.pr).length, 0), 0);
  const trained = new Set(week.map(e => (new Date(e.date).getDay() + 6) % 7));
  const todayIdx = (now.getDay() + 6) % 7;
  const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const dots = names.map((d, n) =>
    `<i class="${trained.has(n) ? "on" : ""}${n === todayIdx ? " today" : ""}" title="${d}${trained.has(n) ? " \u2013 trained" : ""}">${d[0]}</i>`).join("");
  let last = "No workouts logged yet. Open a day, tick off your sets, then hit <strong>Finish workout</strong>.";
  if (log.length) {
    const ago = Math.round((today - dayStart(log[0].date)) / DAY_MS);
    last = `Last workout: <strong>${esc(log[0].day)}</strong> &middot; ${ago <= 0 ? "today" : ago === 1 ? "yesterday" : ago + " days ago"}`;
  }
  el("week").innerHTML = `
    <div class="week-top"><h2>This week</h2><div class="dots">${dots}</div></div>
    <div class="stats">
      <div class="stat s1"><b>${week.length}</b><span>${week.length === 1 ? "Workout" : "Workouts"}</span></div>
      <div class="stat s2"><b>${sets}</b><span>${sets === 1 ? "Set" : "Sets"}</span></div>
      <div class="stat s3"><b>${prs}</b><span>${prs === 1 ? "PR" : "PRs"}</span></div>
    </div>
    <p class="week-last">${last}</p>`;
}

function renderLog() {
  renderWeek();
  const box = el("log");
  if (!log.length) { box.innerHTML = '<p class="muted empty">Nothing logged yet.</p>'; return; }
  box.innerHTML = log.map((entry, n) => {
    const prCount = entry.exercises.reduce((c, e) => c + e.sets.filter(s => s.pr).length, 0);
    const items = entry.exercises.map(e =>
      `<li>${esc(e.name)}: ${esc(formatSets(e.sets)) || "no sets"}${e.sets.some(s => s.pr) ? ' <span class="pr">PR</span>' : ""}${e.notes ? ' <span class="muted">(' + esc(e.notes) + ")</span>" : ""}</li>`
    ).join("");
    return `
      <details>
        <summary>${esc(entry.day)} <span class="muted">&middot; ${esc(fmtDate(entry.date))}</span>${prCount ? ' <span class="pr">' + plural(prCount, "PR") + "</span>" : ""}</summary>
        <ul>${items}</ul>
        <button class="danger" onclick="deleteLogEntry(${n})">Delete Entry</button>
      </details>`;
  }).join("");
}

function renderAll() { render(); renderLog(); renderBody(); renderBackupBanner(); }

// ---------- Start up ----------
el("newDayName").addEventListener("keydown", e => { if (e.key === "Enter") addDay(); });
el("libList").addEventListener("click", e => {
  const item = e.target.closest(".lib-item");
  if (item) pickFromLibrary(item.dataset.name);
});
addEventListener("keydown", e => { if (e.key === "Escape" && !el("sheet").hidden) closeLibrary(); });
el("bwDate").value = todayStr();
setTheme(document.documentElement.getAttribute("data-theme"));
el("version").textContent = "Workout Creator - Version " + APP_VERSION;
renderAll();
</script>
</body>
