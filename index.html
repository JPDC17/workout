<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Creator</title>
<script>
  // Apply the theme before the page draws, so it doesn't flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("workoutTheme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #faf9fc;
    --card: #ffffff;
    --text: #221d2e;
    --muted: #6e6680;
    --border: #ddd8e6;
    --input-bg: #ffffff;
    --accent: #6d28d9;
    --accent-text: #ffffff;
    --accent-soft: #f1ebfc;
  }
  :root[data-theme="dark"] {
    --bg: #15121c;
    --card: #1e1a28;
    --text: #e8e4f0;
    --muted: #a39cb3;
    --border: #353043;
    --input-bg: #18151f;
    --accent: #b197fc;
    --accent-text: #15121c;
    --accent-soft: #2b2340;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; scroll-padding-bottom: 140px; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px; line-height: 1.4;
    background: var(--bg); color: var(--text);
    max-width: 800px; margin: 0 auto; padding: 16px 14px 130px;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 2px; }
  h1 { margin: 0; font-size: 1.6em; }
  h2 { font-size: 1.15em; margin: 0; }
  button, select, input { font: inherit; font-size: 16px; min-height: 40px; padding: 6px 10px; border-radius: 6px; }
  input, select { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary, button.success { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--accent); }
  button.icon { min-width: 40px; padding: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .bar > input { flex: 1 1 200px; }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 14px 0; }
  .day-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
  .day-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
  .count { color: var(--muted); font-size: 0.8em; font-weight: normal; }
  .count::before { content: "("; } .count::after { content: " exercises)"; }
  .exercise { border-top: 1px solid var(--border); padding: 10px 0; }
  .exercise:first-of-type { margin-top: 8px; }
  .exercise-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .exercise-top .actions { display: flex; gap: 4px; }
  .exercise-top .actions button { min-height: 34px; min-width: 34px; padding: 2px; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .fields label { font-size: 0.8em; color: var(--muted); }
  .fields input { width: 100%; }
  .fields .notes { grid-column: 1 / -1; }
  .add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .add-row select, .add-row input { flex: 1 1 180px; }
  .add-row .full { flex: 1 1 100%; }
  .muted { color: var(--muted); font-size: 0.9em; }
  .tag { font-size: 0.8em; color: var(--accent); }
  .empty { padding: 10px 0; }
  details { border-top: 1px solid var(--border); padding: 4px 0; }
  summary { cursor: pointer; padding: 6px 0; }
  details ul { margin: 4px 0 8px; padding-left: 20px; }
  .file-label {
    display: inline-flex; align-items: center; min-height: 40px; padding: 6px 10px; border-radius: 6px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); cursor: pointer;
  }
  .file-label input { display: none; }
  #timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--border); padding: 8px 14px; }
  #timer .inner { max-width: 800px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #timer .label { color: var(--muted); }
  #timerDisplay { font-size: 1.6em; font-weight: bold; min-width: 70px; font-variant-numeric: tabular-nums; }
  #timer.done { background: var(--accent-soft); }
  #timer.done #timerDisplay { color: var(--accent); }
  footer { margin-top: 30px; text-align: center; }
  @media (max-width: 500px) {
    h1 { font-size: 1.35em; }
    .day-buttons { width: 100%; }
    .day-buttons button { flex: 1 1 auto; }
    #timer button { padding: 6px 8px; }
  }
</style>
</head>
<body>

<header>
  <h1>Workout Creator</h1>
  <button id="themeBtn" onclick="toggleTheme()">Dark mode</button>
</header>
<p class="muted" id="status">Changes save automatically in this browser.</p>

<div class="bar">
  <input id="newDayName" placeholder="Day name (e.g. Monday - Push)">
  <button class="primary" onclick="addDay()">+ Add Day</button>
</div>

<div id="days"></div>

<div class="section">
  <h2>Workout Log</h2>
  <p class="muted">Press "Log Workout" on a day after you finish it. It saves today's date with the sets, reps and weights shown, so update them to what you actually lifted first.</p>
  <div id="log"></div>
</div>

<div class="section">
  <h2>Save / Backup</h2>
  <div class="bar">
    <button class="primary" onclick="saveNow()">Save</button>
    <button onclick="exportData()">Export to File</button>
    <label class="file-label">Import from File<input type="file" accept=".json" onchange="importData(event)"></label>
    <button class="danger" onclick="clearAll()">Clear All</button>
  </div>
</div>

<footer class="muted" id="version"></footer>

<!-- Rest timer, pinned to the bottom of the screen -->
<div id="timer">
  <div class="inner">
    <span class="label">Rest</span>
    <span id="timerDisplay">0:00</span>
    <button onclick="startTimer(30)">30s</button>
    <button onclick="startTimer(60)">60s</button>
    <button onclick="startTimer(90)">90s</button>
    <button onclick="startTimer(120)">2m</button>
    <button id="pauseBtn" class="primary" onclick="togglePause()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>
</div>

<script>
const APP_VERSION = "1.3";

// ---------- Dark mode ----------
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = t === "dark" ? "Light mode" : "Dark mode";
}
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try { localStorage.setItem("workoutTheme", t); } catch (e) {}
  setTheme(t);
}

// ---------- Exercise library, grouped by Push / Pull / Legs / Core / Cardio and body part ----------
const LIBRARY = {
  "Push - Chest": ["Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Press", "Incline Dumbbell Press", "Decline Dumbbell Press", "Machine Chest Press", "Smith Machine Bench Press", "Chest Fly", "Incline Dumbbell Fly", "Pec Deck", "Cable Crossover", "Low-to-High Cable Fly", "Push-Ups", "Incline Push-Ups", "Decline Push-Ups", "Dips (Chest)", "Landmine Press", "Svend Press"],
  "Push - Shoulders": ["Overhead Press", "Seated Barbell Press", "Dumbbell Shoulder Press", "Machine Shoulder Press", "Arnold Press", "Push Press", "Lateral Raise", "Cable Lateral Raise", "Machine Lateral Raise", "Front Raise", "Plate Front Raise", "Upright Row", "Pike Push-Ups", "Handstand Push-Ups"],
  "Push - Triceps": ["Tricep Pushdown", "Rope Pushdown", "Single-Arm Cable Pushdown", "Skull Crushers", "Dumbbell Skull Crushers", "Overhead Tricep Extension", "Cable Overhead Extension", "Close-Grip Bench Press", "JM Press", "Dips (Triceps)", "Bench Dips", "Diamond Push-Ups", "Kickbacks"],
  "Pull - Back": ["Deadlift", "Rack Pull", "Pull-Ups", "Chin-Ups", "Neutral-Grip Pull-Ups", "Assisted Pull-Ups", "Lat Pulldown", "Close-Grip Lat Pulldown", "Straight-Arm Pulldown", "Barbell Row", "Pendlay Row", "Dumbbell Row", "Chest-Supported Row", "Seated Cable Row", "T-Bar Row", "Machine Row", "Meadows Row", "Inverted Row", "Back Extension"],
  "Pull - Rear Delts / Traps": ["Face Pulls", "Reverse Fly", "Reverse Pec Deck", "Cable Rear Delt Fly", "Barbell Shrugs", "Dumbbell Shrugs", "Farmer's Carry"],
  "Pull - Biceps": ["Barbell Curl", "EZ-Bar Curl", "Dumbbell Curl", "Alternating Dumbbell Curl", "Hammer Curl", "Incline Dumbbell Curl", "Preacher Curl", "Spider Curl", "Cable Curl", "Bayesian Cable Curl", "Concentration Curl", "Reverse Curl"],
  "Pull - Forearms / Grip": ["Wrist Curl", "Reverse Wrist Curl", "Dead Hang", "Plate Pinch", "Wrist Roller"],
  "Legs - Quads": ["Squat", "Front Squat", "Goblet Squat", "Hack Squat", "Smith Machine Squat", "Leg Press", "Lunges", "Walking Lunges", "Reverse Lunges", "Bulgarian Split Squat", "Step-Ups", "Leg Extension", "Sissy Squat", "Wall Sit"],
  "Legs - Hamstrings / Glutes": ["Romanian Deadlift", "Stiff-Leg Deadlift", "Sumo Deadlift", "Single-Leg Romanian Deadlift", "Lying Leg Curl", "Seated Leg Curl", "Nordic Curl", "Hip Thrust", "Glute Bridge", "Cable Kickback", "Cable Pull-Through", "Good Mornings", "Kettlebell Swing"],
  "Legs - Adductors / Abductors": ["Hip Adduction Machine", "Hip Abduction Machine", "Copenhagen Plank", "Banded Lateral Walk"],
  "Legs - Calves": ["Standing Calf Raise", "Seated Calf Raise", "Leg Press Calf Raise", "Single-Leg Calf Raise", "Tibialis Raise"],
  "Core": ["Plank", "Side Plank", "Crunches", "Bicycle Crunch", "Hanging Leg Raise", "Hanging Knee Raise", "Lying Leg Raise", "Russian Twist", "Cable Crunch", "Ab Wheel", "Dead Bug", "Bird Dog", "Mountain Climbers", "Pallof Press", "Cable Woodchopper", "V-Ups", "Hollow Body Hold", "Sit-Ups"],
  "Cardio / Conditioning": ["Treadmill", "Incline Walk", "Stationary Bike", "Rowing Machine", "Stair Climber", "Elliptical", "Jump Rope", "Burpees", "Sled Push", "Battle Ropes", "Box Jumps"]
};

// Quick templates for a full day
const TEMPLATES = {
  "Push": ["Bench Press", "Overhead Press", "Incline Dumbbell Press", "Lateral Raise", "Tricep Pushdown"],
  "Pull": ["Deadlift", "Pull-Ups", "Barbell Row", "Face Pulls", "Barbell Curl"],
  "Legs": ["Squat", "Romanian Deadlift", "Leg Press", "Lying Leg Curl", "Standing Calf Raise"]
};

const PLAN_KEY = "workoutPlan";
const LOG_KEY = "workoutLog";
let plan = load(PLAN_KEY);
let log = load(LOG_KEY);

function load(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(data)) return data;
  } catch (e) {}
  return [];
}

function save() {
  try {
    localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
    setStatus("Saved " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("Could not save in this browser. Use Export to File.");
  }
}

function setStatus(msg) { document.getElementById("status").textContent = msg; }

function categoryOf(name) {
  for (const cat in LIBRARY) if (LIBRARY[cat].includes(name)) return cat;
  return "Custom";
}

// "Push - Chest" -> "push", used for colors
function groupClass(category) {
  const g = String(category || "").split(" ")[0].toLowerCase();
  return ["push", "pull", "legs", "core"].includes(g) ? g : "custom";
}

function newExercise(name) {
  return { name, category: categoryOf(name), sets: 3, reps: 10, weight: "", notes: "" };
}

// ---------- Days ----------
function addDay() {
  const input = document.getElementById("newDayName");
  const name = input.value.trim() || "Day " + (plan.length + 1);
  plan.push({ name, exercises: [] });
  input.value = "";
  save(); render();
}

function deleteDay(i) {
  if (!confirm("Delete " + plan[i].name + "?")) return;
  plan.splice(i, 1);
  save(); render();
}

function renameDay(i) {
  const name = prompt("New name for this day:", plan[i].name);
  if (name && name.trim()) { plan[i].name = name.trim(); save(); render(); }
}

function moveDay(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= plan.length) return;
  [plan[i], plan[j]] = [plan[j], plan[i]];
  save(); render();
}

function duplicateDay(i) {
  const copy = JSON.parse(JSON.stringify(plan[i]));
  copy.name += " (copy)";
  plan.splice(i + 1, 0, copy);
  save(); render();
}

function applyTemplate(i, key) {
  if (!key) return;
  TEMPLATES[key].forEach(n => plan[i].exercises.push(newExercise(n)));
  save(); render();
}

// ---------- Exercises ----------
function addExercise(i) {
  const select = document.getElementById("pick-" + i);
  const custom = document.getElementById("custom-" + i).value.trim();
  const name = custom || select.value;
  if (!name) return;
  plan[i].exercises.push(newExercise(name));
  save(); render();
}

function deleteExercise(i, k) {
  plan[i].exercises.splice(k, 1);
  save(); render();
}

function moveExercise(i, k, dir) {
  const list = plan[i].exercises, j = k + dir;
  if (j < 0 || j >= list.length) return;
  [list[k], list[j]] = [list[j], list[k]];
  save(); render();
}

function updateField(i, k, field, value) {
  plan[i].exercises[k][field] = value;
  save(); // no re-render so typing isn't interrupted
}

// ---------- Workout log ----------
function logWorkout(i) {
  const day = plan[i];
  if (!day.exercises.length) { alert("Add some exercises before logging."); return; }
  log.unshift({
    date: new Date().toISOString(),
    day: day.name,
    exercises: day.exercises.map(e => ({ name: e.name, sets: e.sets, reps: e.reps, weight: e.weight, notes: e.notes }))
  });
  save(); renderLog();
  setStatus("Logged " + day.name + " for today.");
}

function deleteLogEntry(n) {
  if (!confirm("Delete this log entry?")) return;
  log.splice(n, 1);
  save(); renderLog();
}

// ---------- Rest timer ----------
let timerLeft = 0, timerId = null, paused = false;

function startTimer(seconds) {
  timerLeft = seconds; paused = false;
  document.getElementById("timer").classList.remove("done");
  document.getElementById("pauseBtn").textContent = "Pause";
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  showTime();
}

function tick() {
  if (paused) return;
  timerLeft--;
  showTime();
  if (timerLeft <= 0) {
    clearInterval(timerId); timerId = null;
    document.getElementById("timer").classList.add("done");
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }
}

function togglePause() {
  if (!timerId) return;
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Resume" : "Pause";
}

function resetTimer() {
  clearInterval(timerId); timerId = null; timerLeft = 0; paused = false;
  document.getElementById("timer").classList.remove("done");
  document.getElementById("pauseBtn").textContent = "Pause";
  showTime();
}

function showTime() {
  const t = Math.max(timerLeft, 0);
  document.getElementById("timerDisplay").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.4].forEach(start => {
      const osc = ctx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 0.25);
    });
  } catch (e) {}
}

// ---------- Save / load files ----------
function saveNow() { save(); }

function exportData() {
  const data = { version: APP_VERSION, plan, log };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "workout-plan.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) {          // files exported from Version 1.0 (plan only)
        plan = data;
      } else if (data && Array.isArray(data.plan)) {
        plan = data.plan;
        log = Array.isArray(data.log) ? data.log : [];
      } else {
        throw new Error();
      }
      save(); render(); renderLog();
    } catch (e) {
      alert("That file is not a valid workout plan.");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

function clearAll() {
  if (!confirm("Delete all days, workouts and the workout log?")) return;
  plan = []; log = [];
  save(); render(); renderLog();
}

// ---------- Render ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function exerciseOptions() {
  let html = '<option value="">-- choose exercise --</option>';
  for (const cat in LIBRARY) {
    html += '<optgroup label="' + esc(cat) + '">';
    LIBRARY[cat].forEach(n => html += '<option>' + esc(n) + '</option>');
    html += '</optgroup>';
  }
  return html;
}

function render() {
  const container = document.getElementById("days");
  if (plan.length === 0) {
    container.innerHTML = '<div class="section"><p class="muted empty">No days yet. Add one above to get started.</p></div>';
    return;
  }
  const options = exerciseOptions();
  container.innerHTML = plan.map((day, i) => {
    const exercises = day.exercises.map((ex, k) => `
      <div class="exercise ${groupClass(ex.category)}">
        <div class="exercise-top">
          <div><strong>${esc(ex.name)}</strong><br><span class="tag ${groupClass(ex.category)}">${esc(ex.category)}</span></div>
          <div class="actions">
            <button onclick="moveExercise(${i},${k},-1)" aria-label="Move up">&uarr;</button>
            <button onclick="moveExercise(${i},${k},1)" aria-label="Move down">&darr;</button>
            <button class="danger" onclick="deleteExercise(${i},${k})" aria-label="Delete">&times;</button>
          </div>
        </div>
        <div class="fields">
          <label>Sets<input type="number" inputmode="numeric" min="0" value="${esc(ex.sets)}" oninput="updateField(${i},${k},'sets',this.value)"></label>
          <label>Reps<input type="number" inputmode="numeric" min="0" value="${esc(ex.reps)}" oninput="updateField(${i},${k},'reps',this.value)"></label>
          <label>Weight<input inputmode="decimal" value="${esc(ex.weight)}" placeholder="lbs" oninput="updateField(${i},${k},'weight',this.value)"></label>
          <label class="notes">Notes<input value="${esc(ex.notes)}" oninput="updateField(${i},${k},'notes',this.value)"></label>
        </div>
      </div>`).join("");

    return `
    <div class="section day">
      <div class="day-header">
        <h2>${esc(day.name)} <span class="count">${day.exercises.length}</span></h2>
        <div class="day-buttons">
          <button class="icon" onclick="moveDay(${i},-1)" aria-label="Move day up">&uarr;</button>
          <button class="icon" onclick="moveDay(${i},1)" aria-label="Move day down">&darr;</button>
          <button onclick="renameDay(${i})">Rename</button>
          <button onclick="duplicateDay(${i})">Copy</button>
          <button class="danger" onclick="deleteDay(${i})">Delete Day</button>
        </div>
      </div>
      ${exercises || '<p class="muted empty">No exercises yet. Pick one below or use Quick fill.</p>'}
      <div class="add-row">
        <select id="pick-${i}">${options}</select>
        <input id="custom-${i}" placeholder="or type a custom exercise">
        <button class="primary" onclick="addExercise(${i})">+ Add</button>
        <select onchange="applyTemplate(${i}, this.value)">
          <option value="">Quick fill...</option>
          <option>Push</option><option>Pull</option><option>Legs</option>
        </select>
      </div>
      <div class="add-row">
        <button class="primary full" onclick="logWorkout(${i})">Log Workout (done today)</button>
      </div>
    </div>`;
  }).join("");
}

function renderLog() {
  const container = document.getElementById("log");
  if (log.length === 0) {
    container.innerHTML = '<p class="muted empty">Nothing logged yet.</p>';
    return;
  }
  container.innerHTML = log.map((entry, n) => {
    const date = new Date(entry.date).toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    const items = entry.exercises.map(e =>
      `<li>${esc(e.name)}: ${esc(e.sets)} x ${esc(e.reps)}${e.weight ? " @ " + esc(e.weight) : ""}${e.notes ? " (" + esc(e.notes) + ")" : ""}</li>`
    ).join("");
    return `
      <details>
        <summary>${esc(entry.day)} <span class="muted">&middot; ${esc(date)}</span></summary>
        <ul>${items}</ul>
        <button class="danger" onclick="deleteLogEntry(${n})">Delete Entry</button>
      </details>`;
  }).join("");
}

document.getElementById("newDayName").addEventListener("keydown", e => { if (e.key === "Enter") addDay(); });
setTheme(document.documentElement.getAttribute("data-theme"));
document.getElementById("version").textContent = "Workout Creator - Version " + APP_VERSION;
render();
renderLog();
</script>
</body>
</html>
